<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="dashboard.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Task Statistics</title>
</head>

<body>
    <header>
        <h1>Google Task Statistics</h1>
    </header>

    <main>
        <aside>
            <h2>Task Lists</h2>

            <nav>
                <ul id="task-list-navigation"></ul>
            </nav>
        </aside>

        <section>
            <h2>Tasks</h2>
                <ul id="task-list"></ul>
        </section>

        <section>
            <h2>Statistics</h2>

            <p>Completed tasks: <span id="completed-count">0</span></p>
            <p>Pending tasks: <span id="pending-count">0</span></p>

            <div>
                Chart placeholder
            </div>
        </section>
    </main>
    <script type ="module" src="../dist/dashboard/dashboard.js"></script>
</body>
</html>
