<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="dashboard.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Task Statistics</title>
</head>

<body>
    <header>
        <h1>Google Task Statistics</h1>
    </header>

    <main>
        <aside>
            <h2>Task Lists</h2>

            
            <nav>
                <ul id="task-list-navigation"></ul>
            </nav>
        </aside>

        <section>
            <h2>Tasks</h2>
            <button id="open-new-task-dialog" type="button">
                Add task
            </button>

            <dialog id="new-task-dialog">
                <form id="new-task-form">
                    <h2>Create task</h2>

                    <label for="new-task-title">Title</label>
                    <input
                        id="new-task-title"
                        type="text"
                        required
                    >

                    <label for="new-task-details">Details</label>
                    <textarea id="new-task-details"></textarea>

                    <label for="new-task-due-date">Due date</label>
                    <input
                        id="new-task-due-date"
                        type="date"
                    >

                    <div class="form-actions">
                    
                    <button
                        id="cancel-new-task"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button type="submit">
                        Create task
                    </button>
                </div>
                </form>
            </dialog>

                <ul id="task-list"></ul>
        </section>

        <section>
            <h2>Statistics</h2>

            <p>Completed tasks: <span id="completed-count">0</span></p>
            <p>Pending tasks: <span id="pending-count">0</span></p>

            <div>
                Chart placeholder
            </div>
        </section>
    </main>
    <script type ="module" src="../dist/dashboard/dashboard.js"></script>
</body>
</html>
